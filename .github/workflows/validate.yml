name: Validate skills and release artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Regression tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Check standalone references
        run: python scripts/sync_references.py --check
      - name: Validate offline compatibility snapshot and source
        run: python scripts/validate_release.py --root .
      - name: Build deterministic release artifacts
        run: python build-release-zips.py --root . --output dist
      - name: Validate archives, manifest and checksums
        run: python scripts/validate_release.py --root . --archives dist